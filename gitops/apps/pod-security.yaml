apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pod-security
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  source:
    repoURL: https://github.com/Corrierethan/eks-gitops-platform.git
    targetRevision: main
    path: policies/pod-security
  destination:
    server: https://kubernetes.default.svc
    namespace: sample-app
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
